<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gayatri Narayanan — Photography</title>
  <meta name="description" content="Commercial & lifestyle photography, Dubai." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="site-header" id="siteHeader">
    <a href="#top" class="wordmark" id="wordmark"></a>
    <button class="menu-btn" id="menuToggle" aria-haspopup="true" aria-expanded="false" aria-controls="menuOverlay">
      <span class="menu-btn-rule" aria-hidden="true"></span>
      Menu
    </button>
  </header>

  <main id="top">
    <section id="hero" class="hero-section"></section>
    <section id="marquee" class="marquee-section"></section>
    <section id="about" class="about-section"></section>
    <section id="services" class="services-section"></section>
    <section id="portfolio" class="portfolio-section"></section>
    <section id="clients" class="clients-section"></section>
    <section id="testimonials" class="testimonials-section"></section>
    <section id="contact" class="contact-section"></section>
  </main>

  <footer class="site-footer" id="siteFooter"></footer>

  <div class="menu-overlay" id="menuOverlay" aria-hidden="true">
    <div class="menu-overlay-content">
      <div class="menu-overlay-eyebrow">Menu</div>
      <ul class="menu-overlay-list" id="menuOverlayList"></ul>
      <div class="menu-overlay-hint">Click anywhere to close</div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
